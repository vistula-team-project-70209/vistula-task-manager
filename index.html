<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Task Manager</h1>
      <p>Student ID: <span id="student-id">70209</span></p>
      <p>Organise your tasks and track your progress.</p>
    </header>

    <section class="task-form">
      <h2>Add a New Task</h2>
      <form id="task-form">
        <label for="task-title">Task Title</label>
        <input
          type="text"
          id="task-title"
          placeholder="Enter task title"
          required
        >

        <label for="task-description">Description</label>
        <textarea
          id="task-description"
          placeholder="Enter task description (optional)"
        ></textarea>

        <button type="submit" id="task-submit">
          Add Task
        </button>
      </form>
    </section>

    <section class="task-section">
      <h2>My Tasks</h2>
      <p id="status-message" role="status"></p>
      <div id="task-list"></div>
      <p><a id="contribution-link" href="contribution.html">View Contribution</a></p>
    </section>
  </main>
</body>
</html>
